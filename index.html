<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Planner</title>
    
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
</head>

<div class="theme-menu">
    <button id="themeButton">🎨</button>
    <div class="themes">
    <button class="default" onclick="setTheme('default')" title="Padrão"></button>
    <button class="pink" onclick="setTheme('pink')"></button>
    <button class="blue" onclick="setTheme('blue')"></button>
    <button class="green" onclick="setTheme('green')"></button>
    <button class="purple" onclick="setTheme('purple')"></button>
</div>
<body>

    <header>
    <h1>To do list </h1>
        <p>Organize your day.</p> 
</header>
    <div class="container">
        <div class="form">
            <input type="text" id="taskInput" placeholder="Add task...">

            <select id="weekday">
                <option>Monday</option>
                <option>Tuesday</option>
                <option>Wednesday</option>
                <option>Thursday</option>
                <option>Friday</option>
                <option>Saturday</option>
                <option>Sunday</option>
            </select>

            <label class="checkbox">
                <input type="checkbox" id="weekly">
                Fixed task
            </label>

            <button onclick="addTask()">
                Add 
            </button>
            
        </div>
        <div id="taskList"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
